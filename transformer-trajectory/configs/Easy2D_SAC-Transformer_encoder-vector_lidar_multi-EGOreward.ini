# ==================== 通用配置 ====================
[options]
env_name = Easy_2D
dynamic_name = Multirotor
perception = lidar_vector_multi
policy_name = MLP_embedding_Transformer_encoder
activation_function = tanh
q_map_save_steps = 10000
total_timesteps = 100000000
algo = SAC
reward_type = math_model
lidar_feature_length = 64
goal_feature_length = 3
uav_feature_length = 5
net_arch = [192,64]
use_wandb = False
save_freq = 10000
frame_history = 4
action_smooth_enable = True
action_smooth_window = 4
dim = 2
[wandb]
name = Easy_2D-2D-MLP_embedding_Transformer_encoder-tanh-SAC
notes = test SAC with Transformer encoder

[reward]
w_p = 300.0
w_t = -0.1
w_s = 5.0
w_e = 0.05
w_j = 0.002

w_yaw_align = 1.0  
w_yaw_rate = 0.1    
w_yaw_trend = 0.2  

w_vel_align = 0.3

# ==================== 环境配置 ====================
[environment]
crash_distance = 0.6
accept_radius = 1.5
use_dynamic_obstacles = True

lidar_points_per_layer = 120
lidar_num_layers = 20
lidar_max_range = 10
verticalfovupper = 30
verticalfovlower = -30
horizontalfovstart = -180
horizontalfovend = 180
lidar_sensor_name = LidarSensor1

[curriculum]
enabled = true
config_path = configs/curriculum_config.yaml

# ==================== 动力学配置 ====================
[multirotor]
dt = 0.1
v_xy_max = 5.0
v_z_max = 5.0
acc_xy_max = 5.0
acc_z_max = 5.0
yaw_rate_max_deg = 60.0
# ==================== 算法专有配置 ====================

# ---------- SAC 专用参数 ----------
[SAC]
buffer_size = 200000
learning_starts = 10000
batch_size = 512
learning_rate = 3e-4
gamma = 0.995
train_freq = 100
gradient_steps = 100
tau = 0.005
ent_coef = auto
target_entropy = auto
target_update_interval = 1

# ---------- PPO 专用参数 ----------
[PPO]
n_steps = 512
n_epochs = 10
batch_size = 64
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.97
clip_range = 0.2
clip_range_vf = 0.2
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5


# ---------- TD3 专用参数 ----------
[TD3]
buffer_size = 200000
learning_starts = 100
batch_size = 51
learning_rate = 3e-4
gamma = 0.99
train_freq = 100
gradient_steps = 100
tau = 0.005
policy_delay = 2
target_policy_noise = 0.2
target_noise_clip = 0.5
action_noise_sigma = 0.1
