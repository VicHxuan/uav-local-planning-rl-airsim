# ==================== 通用配置 ====================
[options]
env_name = NavRL_2D
dynamic_name = Multirotor
perception = lidar_vector_multi
policy_name = MLP_embedding_Transformer_encoder
activation_function = tanh
q_map_save_steps = 10000
total_timesteps = 100000000
algo = SAC
reward_type = math_model
lidar_feature_length = 64
goal_feature_length = 3
uav_feature_length = 5
net_arch = [256,256]
use_wandb = False
save_freq = 10000
frame_history = 4
action_smooth_enable = True
action_smooth_window = 4
dim = 2
use_safe_vel = False
vel_safe_lidar_dist = 5.0
max_episode_steps = 300
[wandb]
name = NavRL_2D-2D-MLP_embedding_Transformer_encoder-tanh-SAC
notes = test SAC with Transformer encoder

[reward]
w_p = 300.0
w_t = -0.1
w_s = 5.0
w_e = 0.05
w_j = 0.002

w_yaw_align = 1.0  
w_yaw_rate = 0.1    
w_yaw_trend = 0.2  
w_vel_align = 0.5

# ==================== 环境配置 ====================
[environment]
crash_distance = 0.6
accept_radius = 1.5
use_dynamic_obstacles = True

lidar_points_per_layer = 120
lidar_num_layers = 20
lidar_max_range = 10
verticalfovupper = 30
verticalfovlower = -30
horizontalfovstart = -180
horizontalfovend = 180
lidar_sensor_name = LidarSensor1

[goal]
goal_mode = random
goal_fixed_x = 30.0
goal_fixed_y = -30.0
goal_fixed_z = 5.0
goal_move_step_length = 0.1
goal_distance_init = 20.0

[curriculum]
enabled = true
config_path = configs/curriculum_config.yaml

# ==================== 动力学配置 ====================
[multirotor]
dt = 0.1
v_xy_max = 3.0
v_z_max = 3.0
acc_xy_max = 3.0
acc_z_max = 5.0
yaw_rate_max_deg = 90.0
# ==================== 算法专有配置 ====================

# ---------- SAC 专用参数 ----------
[SAC]
buffer_size = 200000
learning_starts = 10000
batch_size = 256
learning_rate = 3e-4
gamma = 0.995
train_freq = 1
gradient_steps = 1
tau = 0.005
ent_coef = auto
target_entropy = auto
target_update_interval = 1

