[options]
env_name = Easy_2D
dynamic_name = Multirotor
navigation_3d = False
using_velocity_state = True
perception = lidar_vector
policy_name = No_CNN
activation_function = tanh
keyboard_debug = False
generate_q_map = True
q_map_save_steps = 10000
total_timesteps = 300000
algo = SAC
reward_type = reward_final
lidar_feature_length = 12
net_arch = [64, 32, 16]
use_wandb = True
save_freq = 10000

[wandb]
name = Easy_2D-2D-No_CNN-tanh-SAC
notes = test

[environment]
crash_distance = 1
accept_radius = 1
max_depth_meters = 20
screen_height = 84
screen_width = 84
lidar_points_per_layer = 120
lidar_num_layers = 20
lidar_max_range = 10
verticalfovupper = 30
verticalfovlower = -30
horizontalfovstart = -180
horizontalfovend = 180
lidar_sensor_name = LidarSensor1

[multirotor]
dt = 0.1
acc_xy_max = 5
v_xy_max = 5
v_xy_min = 0.5
v_z_max = 5
yaw_rate_max_deg = 30.0

[DRL]
gamma = 0.99
learning_rate = 1e-3
learning_starts = 2000
buffer_size = 50000
batch_size = 1280
train_freq = 500
gradient_steps = 500
action_noise_sigma = 0.1

